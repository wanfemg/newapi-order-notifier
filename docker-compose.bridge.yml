# 覆盖层：new-api 使用普通 docker 网络时，本服务加入同一网络并发布界面端口
# UI_BIND_ADDR 是宿主机侧的绑定地址，默认 127.0.0.1（只有本机能访问，不暴露公网）
services:
  order-notifier:
    ports:
      - "${UI_BIND_ADDR:-127.0.0.1}:${UI_PUBLISH_PORT:-8765}:${UI_BIND_PORT:-8080}"
    networks:
      - newapi

networks:
  newapi:
    external: true
    name: ${NEWAPI_NETWORK:-new-api-network}
