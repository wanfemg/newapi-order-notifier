<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>new-api 财务后台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="overlay hidden">
    <form id="login-form" class="glass login-card">
      <h2>管理登录</h2>
      <p class="muted">口令在容器日志中打印（或由 UI_PASSWORD 环境变量指定）</p>
      <input type="password" id="password" placeholder="管理口令" aria-label="管理口令" autocomplete="current-password" required>
      <button type="submit" class="btn primary">登录</button>
      <p id="login-error" class="error" role="status"></p>
    </form>
  </div>

  <div id="app" class="shell hidden">
    <header class="topbar glass">
      <div class="brand">
        <span>财务后台</span>
        <span id="version" class="pill"></span>
      </div>
      <div class="top-actions">
        <div id="range" class="seg" aria-label="时间范围"></div>
        <button id="theme-toggle" class="btn" title="切换深浅色">深色</button>
        <button id="logout" class="btn ghost">退出</button>
      </div>
    </header>

    <nav class="nav glass" aria-label="主导航">
      <a href="#/overview" data-view="overview">概览</a>
      <a href="#/orders" data-view="orders">订单流水</a>
      <a href="#/ranking" data-view="ranking">排行榜</a>
      <a href="#/users" data-view="users">用户画像</a>
      <a href="#/rates" data-view="rates">汇率配置</a>
      <a href="#/consumption" data-view="consumption">消耗统计</a>
      <a href="#/reports" data-view="reports">报表与推送</a>
      <a href="#/settings" data-view="settings">设置</a>
    </nav>

    <main class="content">
      <section id="view-overview" class="view"></section>
      <section id="view-orders" class="view"></section>
      <section id="view-ranking" class="view"></section>
      <section id="view-users" class="view"></section>
      <section id="view-rates" class="view"></section>
      <section id="view-consumption" class="view"></section>
      <section id="view-reports" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
