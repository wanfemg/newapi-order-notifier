<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>new-api 财务后台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳至主要内容</a>
  <div class="ambient ambient-blue" aria-hidden="true"></div>
  <div class="ambient ambient-ice" aria-hidden="true"></div>
  <div id="login" class="overlay hidden">
    <form id="login-form" class="glass login-card">
      <div class="brand-mark" data-icon="layers" aria-hidden="true"></div>
      <span class="eyebrow">NEW API / FINANCE</span>
      <h2>进入财务工作台</h2>
      <p class="muted">安全管理订单、收入与每一次推送。</p>
      <label for="password">管理口令</label>
      <input type="password" id="password" placeholder="输入管理口令" autocomplete="current-password" required>
      <button type="submit" class="btn primary">登录工作台</button>
      <p class="login-hint muted">口令在容器日志中打印，或由 UI_PASSWORD 环境变量指定。</p>
      <p id="login-error" class="error" role="status"></p>
    </form>
  </div>

  <div id="app" class="shell hidden">
    <aside class="sidebar glass">
      <a class="brand" href="#/overview" aria-label="new-api 财务后台首页">
        <span class="brand-mark" data-icon="layers" aria-hidden="true"></span>
        <span class="brand-copy"><strong>new-api</strong><span>财务工作台</span></span>
      </a>
      <span class="nav-caption">工作空间 / WORKSPACE</span>
      <nav class="nav" aria-label="主导航">
        <a href="#/overview" data-view="overview"><span data-icon="overview" aria-hidden="true"></span><span>概览</span><span class="nav-index">01</span></a>
        <a href="#/orders" data-view="orders"><span data-icon="orders" aria-hidden="true"></span><span>订单流水</span><span class="nav-index">02</span></a>
        <a href="#/ranking" data-view="ranking"><span data-icon="ranking" aria-hidden="true"></span><span>充值排行</span><span class="nav-index">03</span></a>
        <a href="#/users" data-view="users"><span data-icon="users" aria-hidden="true"></span><span>用户画像</span><span class="nav-index">04</span></a>
        <a href="#/reports" data-view="reports"><span data-icon="reports" aria-hidden="true"></span><span>报表与推送</span><span class="nav-index">05</span></a>
        <a href="#/settings" data-view="settings"><span data-icon="settings" aria-hidden="true"></span><span>设置</span><span class="nav-index">06</span></a>
      </nav>
      <div class="sidebar-foot">
        <span class="eyebrow">FINANCIAL CONSOLE</span>
        <div class="sidebar-meta"><span>new-api 财务后台</span><span id="version" class="pill"></span></div>
        <p>收入有据，每笔清晰。</p>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span class="breadcrumb-mark" data-icon="layers" aria-hidden="true"></span><span>财务管理</span><span class="breadcrumb-separator">/</span><span id="route-label">概览</span></div>
        <div class="top-actions">
          <button id="theme-toggle" class="btn ghost" title="切换深浅色">深色</button>
          <button id="logout" class="btn ghost"><span data-icon="logout" aria-hidden="true"></span><span>退出</span></button>
        </div>
      </header>
      <div class="page-heading">
        <div><span id="page-eyebrow" class="eyebrow">FINANCIAL OVERVIEW</span><h1 id="page-title">收支概览</h1><p id="page-description">从收入趋势到订单构成，掌握每一笔成功交易。</p></div>
        <span class="page-seal" data-icon="overview" aria-hidden="true"></span>
      </div>
      <div id="period-toolbar" class="period-toolbar">
        <div class="period-label"><span data-icon="calendar" aria-hidden="true"></span><span>统计周期</span><span id="range-caption" class="muted">近 7 天</span></div>
        <div id="range" class="seg" role="group" aria-label="时间范围"></div>
      </div>
      <main id="main-content" class="content" tabindex="-1">
        <section id="view-overview" class="view" aria-label="收支概览"></section>
        <section id="view-orders" class="view" aria-label="订单流水"></section>
        <section id="view-ranking" class="view" aria-label="充值排行"></section>
        <section id="view-users" class="view" aria-label="用户画像"></section>
        <section id="view-reports" class="view" aria-label="报表与推送"></section>
        <section id="view-settings" class="view" aria-label="设置"></section>
      </main>
      <footer class="workspace-footer"><span>NEW API · 财务工作台</span><span>统计以实际订单数据为准</span></footer>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
